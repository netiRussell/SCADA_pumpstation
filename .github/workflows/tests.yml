
name: SCADA pump station Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install PyTest
        run: python -m pip install pytest

      - name: Run timer regression test
        run: python -m pytest tests/test_timer_event.py -v
